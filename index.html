<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#071b26">
  <title>Rocket League 3D – Mini-Spiel</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f3fbff; background: #07131d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 0%, #173746, #07131d 68%); }
    main { width: min(1200px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 10px; }
    h1 { margin: 0; font-size: clamp(1.05rem, 3vw, 1.65rem); }
    .score { display: flex; align-items: center; gap: 12px; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 12px #000; }
    #blueScore { color: #64bdff; } #orangeScore { color: #ffad62; }
    button { border: 1px solid #517281; background: #102a36; color: white; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
    button:hover { background: #1b3d4c; }
    .viewport { position: relative; overflow: hidden; border: 1px solid #426170; border-radius: 14px; background: #102d26; box-shadow: 0 22px 65px #0009; }
    canvas { display: block; width: 100%; height: min(70vh, 700px); min-height: 360px; touch-action: none; }
    .hud { position: absolute; inset: 14px 16px auto; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .boost { width: 155px; padding: 9px 11px; border-radius: 9px; background: #07131dbb; border: 1px solid #ffffff25; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .boost-track { height: 8px; margin-top: 6px; border-radius: 10px; background: #34444a; overflow: hidden; }
    #boostBar { height: 100%; width: 100%; background: linear-gradient(90deg, #f8d54c, #ff812f); transition: width .08s linear; }
    #message { padding: 8px 12px; border-radius: 9px; background: #07131dbb; border: 1px solid #ffffff25; font-weight: 800; }
    .controls { display: flex; flex-wrap: wrap; gap: 7px 16px; padding: 10px 2px 0; color: #bdd0d8; font-size: .88rem; }
    kbd { border: 1px solid #52717c; border-radius: 5px; background: #122e39; padding: 1px 5px; color: #fff; }
    #padStatus { margin-left: auto; color: #9ed7b7; }
    @media (max-width: 650px) { body { padding: 8px; } canvas { min-height: 320px; height: 62vh; } #padStatus { width: 100%; margin-left: 0; } .boost { width: 125px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🏎️ Rocket League 3D</h1>
    <div class="score" aria-live="polite"><span id="blueScore">0</span><span>:</span><span id="orangeScore">0</span></div>
    <button id="restart">Neustart</button>
  </header>
  <section class="viewport" aria-label="3D-Spiel">
    <div class="hud"><div class="boost">BOOST<div class="boost-track"><div id="boostBar"></div></div></div><div id="message">Los geht's!</div></div>
    <div id="game"></div>
  </section>
  <div class="controls">
    <span><kbd>W</kbd>/<kbd>↑</kbd> Gas</span><span><kbd>S</kbd>/<kbd>↓</kbd> Rückwärts</span>
    <span><kbd>A</kbd>/<kbd>D</kbd> Lenken</span><span><kbd>Shift</kbd> Boost</span><span><kbd>R</kbd> Ball zurücksetzen</span>
    <span>Controller: linker Stick · RT Gas · LT Rückwärts · X/RB Boost</span><span id="padStatus">Controller verbinden oder Taste drücken</span>
  </div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

const mount = document.querySelector('#game');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#91c5df');
scene.fog = new THREE.Fog('#91c5df', 65, 145);
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
mount.appendChild(renderer.domElement);

const FIELD_W = 48, FIELD_L = 72, HALF_W = FIELD_W / 2, HALF_L = FIELD_L / 2;
const GOAL_W = 13, GOAL_H = 7, BALL_R = 1.15;
const keys = new Set();
const clock = new THREE.Clock();
const v3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const mat = (color, roughness=.8, metalness=0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
const turf = mat('#247c4b'), stripeMat = mat('#2c8952'), white = mat('#e9fff0'), blue = mat('#249cff', .32, .2), orange = mat('#ff8c35', .32, .2), dark = mat('#14232a', .45), glass = new THREE.MeshStandardMaterial({ color:'#bdeaff', roughness:.2, metalness:.1, transparent:true, opacity:.8 });

scene.add(new THREE.HemisphereLight('#e9f8ff', '#355334', 2.0));
const sun = new THREE.DirectionalLight('#fff2d6', 3.2);
sun.position.set(-25, 45, 28); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55; sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
sun.shadow.bias = -0.00015; scene.add(sun);

function box(parent, name, size, material, pos, cast=true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  mesh.name = name; mesh.position.set(...pos); mesh.castShadow = cast; mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
function line(points, color='#eafff2', opacity=.9, radius=.055) {
  const curve = new THREE.LineCurve3(v3(...points[0]), v3(...points[1]));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1, radius, 6, false), new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity }));
  scene.add(mesh); return mesh;
}

// Pitch, alternating turf, markings, low arena walls and a simple stadium bowl.
box(scene, 'pitch-base', [FIELD_W, .35, FIELD_L], turf, [0, -.2, 0], false);
for (let i=0; i<9; i++) box(scene, 'grass stripe', [FIELD_W, .012, FIELD_L/9], i%2 ? turf : stripeMat, [0, -.015, -HALF_L+(i+.5)*FIELD_L/9], false);
for (const x of [-HALF_W, HALF_W]) box(scene, 'side wall', [.55, 2, FIELD_L+1], mat('#285160'), [x, 1, 0]);
// End walls leave the goal aperture open.
for (const z of [-HALF_L, HALF_L]) {
  for (const x of [-HALF_W/2-GOAL_W/4, HALF_W/2+GOAL_W/4]) box(scene, 'end wall', [FIELD_W/2-GOAL_W/2, 2, .55], mat('#285160'), [x, 1, z]);
  box(scene, 'crossbar', [GOAL_W, .42, .48], z < 0 ? blue : orange, [0, GOAL_H, z]);
  for (const x of [-GOAL_W/2, GOAL_W/2]) box(scene, 'goal post', [.42, GOAL_H, .48], z < 0 ? blue : orange, [x, GOAL_H/2, z]);
  // Recessed goal floor and net-like back panel.
  const goal = box(scene, 'goal floor', [GOAL_W, .12, 6], z < 0 ? mat('#1b5b88') : mat('#8b4e23'), [0, -.015, z + Math.sign(z)*3], false);
  const net = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W, GOAL_H, .15), new THREE.MeshBasicMaterial({ color: z < 0 ? '#65bfff' : '#ffc184', wireframe: true, transparent:true, opacity:.34 }));
  net.position.set(0, GOAL_H/2, z + Math.sign(z)*6); scene.add(net);
}
// Pitch lines.
line([[-HALF_W, .025, -HALF_L], [HALF_W, .025, -HALF_L]]);
line([[-HALF_W, .025, HALF_L], [HALF_W, .025, HALF_L]]);
line([[-HALF_W, .025, -HALF_L], [-HALF_W, .025, HALF_L]]);
line([[HALF_W, .025, -HALF_L], [HALF_W, .025, HALF_L]]);
line([[0, .03, -HALF_L], [0, .03, HALF_L]]);
const centerCircle = new THREE.Mesh(new THREE.TorusGeometry(8, .055, 6, 96), new THREE.MeshBasicMaterial({ color:'#eafff2' }));
centerCircle.rotation.x = Math.PI/2; centerCircle.position.y=.04; scene.add(centerCircle);
const centerDot = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.07,20), white); centerDot.position.y=.04; scene.add(centerDot);
for (const z of [-HALF_L+10, HALF_L-10]) {
  const area = new THREE.Mesh(new THREE.BoxGeometry(25,.05,12), new THREE.MeshBasicMaterial({color:'#eafff2', wireframe:true}));
  area.position.set(0,.035,z); scene.add(area);
}
// Stadium stands and floodlights.
for (let tier=0; tier<4; tier++) {
  const standMat = mat(tier%2 ? '#304754' : '#253c48');
  for (const side of [-1,1]) box(scene,'stands',[4,2.1,FIELD_L+18],standMat,[side*(HALF_W+3+tier*2),3+tier*1.6,0],false);
  for (const end of [-1,1]) box(scene,'stands',[FIELD_W+18,2.1,4],standMat,[0,3+tier*1.6,end*(HALF_L+3+tier*2)],false);
}
for (const x of [-29,29]) for (const z of [-42,42]) {
  box(scene,'light pole',[.35,15,.35],dark,[x,7.5,z]);
  const lamp = new THREE.PointLight('#d9f4ff', 90, 50, 2); lamp.position.set(x,15,z); scene.add(lamp);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(3,.3,1), new THREE.MeshBasicMaterial({color:'#e8fbff'})); panel.position.set(x,15,z); scene.add(panel);
}

// Player car: lightweight custom 3D body with wheels, glass, lights and boost exhaust.
const carRoot = new THREE.Group(); scene.add(carRoot);
const carBody = new THREE.Group(); carRoot.add(carBody);
box(carBody,'chassis',[2.35,.72,4.1],blue,[0,.82,0]);
box(carBody,'hood',[2.08,.32,1.35],blue,[0,1.15,-1.15]);
box(carBody,'cabin',[1.58,.78,1.72],glass,[0,1.45,.42]);
box(carBody,'spoiler',[2.25,.12,.28],blue,[0,1.48,1.78]);
for (const side of [-1,1]) {
  box(carBody,'spoiler support',[.12,.42,.12],dark,[side*.74,1.25,1.72]);
  for (const z of [-1.25,1.3]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.34,18), dark);
    wheel.rotation.z=Math.PI/2; wheel.position.set(side*1.15,.52,z); wheel.castShadow=true; carBody.add(wheel);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.36,16), mat('#9db3bd',.4,.65));
    hub.rotation.z=Math.PI/2; hub.position.set(side*1.15,.52,z); carBody.add(hub);
  }
  const headlight = new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.08), mat('#efffff',.25,.1)); headlight.position.set(side*.72,1.04,-2.08); carBody.add(headlight);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.08), mat('#ff463c',.3)); tail.position.set(side*.72,1.04,2.08); carBody.add(tail);
}
const flame = new THREE.Mesh(new THREE.ConeGeometry(.45,1.8,12), new THREE.MeshBasicMaterial({color:'#ff9d28'}));
flame.rotation.x=-Math.PI/2; flame.position.set(0,.82,2.55); flame.visible=false; carBody.add(flame);
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R,32,24), new THREE.MeshStandardMaterial({color:'#f5f5ee',roughness:.36,metalness:.04}));
ballMesh.castShadow=true; ballMesh.receiveShadow=true; scene.add(ballMesh);
const ballLines = new THREE.Mesh(new THREE.IcosahedronGeometry(BALL_R*1.006,1), new THREE.MeshBasicMaterial({color:'#45515a',wireframe:true,transparent:true,opacity:.38})); scene.add(ballLines);

const car = { x:0, z:22, yaw:0, speed:0, boost:100 };
const ball = { x:0, y:BALL_R, z:0, vx:0, vy:0, vz:0 };
let scores=[0,0], goalPause=0, activePad=null, lastPadState=null;
const blueScore=document.querySelector('#blueScore'), orangeScore=document.querySelector('#orangeScore');
const padStatus=document.querySelector('#padStatus'), boostBar=document.querySelector('#boostBar'), message=document.querySelector('#message');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resetPositions() {
  car.x=0; car.z=22; car.yaw=0; car.speed=0;
  ball.x=0; ball.y=BALL_R; ball.z=0; ball.vx=ball.vy=ball.vz=0;
}
function updateScores(){blueScore.textContent=scores[0];orangeScore.textContent=scores[1];}
function restart(){scores=[0,0];updateScores();resetPositions();goalPause=0;message.textContent="Los geht's!";}
document.querySelector('#restart').addEventListener('click',restart);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='r')resetPositions();});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
window.addEventListener('gamepadconnected',e=>activePad=e.gamepad.index);
window.addEventListener('gamepaddisconnected',e=>{if(activePad===e.gamepad.index)activePad=null;});
function getPad(){
  const pads=navigator.getGamepads?.()||[]; let p=activePad===null?null:pads[activePad];
  if(!p)p=Array.from(pads).find(Boolean)||null;
  if(!p)return {connected:false,steer:0,throttle:0,boost:false};
  activePad=p.index; const b=i=>p.buttons[i]?.pressed||false;
  const axis=p.axes[0]||0, steer=Math.abs(axis)<.14?0:axis;
  const throttle=Math.max(b(0)?1:0,p.buttons[7]?.value||0)-Math.max(b(1)?1:0,p.buttons[6]?.value||0);
  return {connected:true,id:p.id,steer,throttle,boost:b(2)||b(5)};
}
function scoreGoal(team){scores[team]++;updateScores();message.textContent=team===0?'TOR! Blau punktet':'TOR! Orange punktet';goalPause=1.5;resetPositions();}
function simulate(dt){
  const pad=getPad(); lastPadState=pad;
  const keySteer=(keys.has('a')||keys.has('arrowleft')?-1:0)+(keys.has('d')||keys.has('arrowright')?1:0);
  const keyThrottle=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
  const steer=pad.connected&&Math.abs(pad.steer)>.01?pad.steer:keySteer;
  const throttle=pad.connected&&Math.abs(pad.throttle)>.01?pad.throttle:keyThrottle;
  const boosting=(keys.has('shift')||pad.boost)&&car.boost>0;
  padStatus.textContent=pad.connected?`Controller: ${pad.id}`:'Controller verbinden oder Taste drücken';
  if(goalPause>0){goalPause-=dt;if(goalPause<=0)message.textContent='Los geht\'s!';return;}
  if(boosting){car.speed+=34*dt;car.boost=Math.max(0,car.boost-28*dt);}else car.boost=Math.min(100,car.boost+10*dt);
  car.speed+=throttle*21*dt; car.speed*=Math.pow(.985,dt*60); car.speed=clamp(car.speed,-10,boosting?34:24);
  car.yaw+=steer*2.35*clamp(Math.abs(car.speed)/5,.3,1.35)*dt*(car.speed<-.2?-1:1);
  const forwardX=Math.sin(car.yaw), forwardZ=-Math.cos(car.yaw);
  car.x+=forwardX*car.speed*dt;car.z+=forwardZ*car.speed*dt;
  const carR=1.55;
  if(Math.abs(car.x)>HALF_W-carR){car.x=clamp(car.x,-HALF_W+carR,HALF_W-carR);car.speed*=-.38;}
  if(Math.abs(car.z)>HALF_L-carR){car.z=clamp(car.z,-HALF_L+carR,HALF_L-carR);car.speed*=-.38;}
  carRoot.position.set(car.x,0,car.z);carRoot.rotation.y=car.yaw;
  carBody.rotation.z=clamp(-steer*car.speed*.008,-.12,.12);
  flame.visible=boosting&&Math.abs(car.speed)>2; flame.scale.setScalar(.8+Math.random()*.55);

  // Ball gravity, turf friction, side/end-wall rebounds and goal detection.
  ball.vy-=19.6*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;
  if(ball.y<BALL_R){ball.y=BALL_R;if(ball.vy<0)ball.vy*=-.58;ball.vx*=Math.pow(.985,dt*60);ball.vz*=Math.pow(.985,dt*60);if(Math.abs(ball.vy)<1.1)ball.vy=0;}
  if(ball.x<-HALF_W+BALL_R||ball.x>HALF_W-BALL_R){ball.x=clamp(ball.x,-HALF_W+BALL_R,HALF_W-BALL_R);ball.vx*=-.78;}
  const goalOpening=Math.abs(ball.x)<GOAL_W/2-BALL_R*.35&&ball.y<GOAL_H-BALL_R*.25;
  if(Math.abs(ball.z)>HALF_L && goalOpening){scoreGoal(ball.z<0?0:1);return;}
  if(Math.abs(ball.z)>HALF_L-BALL_R&&!goalOpening){ball.z=clamp(ball.z,-HALF_L+BALL_R,HALF_L-BALL_R);ball.vz*=-.78;}
  ball.vx*=Math.pow(.998,dt*60);ball.vz*=Math.pow(.998,dt*60);
  // Car/ball contact: a forward impulse with a small lift.
  const dx=ball.x-car.x,dz=ball.z-car.z,dist=Math.hypot(dx,dz),contact=2.15;
  if(dist<contact&&ball.y<2.8){
    const nx=dist>.001?dx/dist:forwardX,nz=dist>.001?dz/dist:forwardZ;
    ball.x=car.x+nx*contact;ball.z=car.z+nz*contact;
    const hit=Math.max(5,Math.abs(car.speed)*.72);
    ball.vx=nx*hit+forwardX*Math.max(0,car.speed)*.8;
    ball.vz=nz*hit+forwardZ*Math.max(0,car.speed)*.8;
    ball.vy=Math.max(ball.vy,2.2+Math.max(0,car.speed)*.07);
  }
  ballMesh.position.set(ball.x,ball.y,ball.z);ballLines.position.copy(ballMesh.position);
  ballMesh.rotation.x+=ball.vz*dt*.35;ballMesh.rotation.z-=ball.vx*dt*.35;
  boostBar.style.width=`${car.boost}%`;
}

const cameraTarget=v3();
function followCamera(dt){
  const behindX=Math.sin(car.yaw),behindZ=Math.cos(car.yaw);
  const desired=v3(car.x-behindX*13,8.5,car.z-behindZ*13);
  camera.position.lerp(desired,1-Math.exp(-4.2*dt));
  cameraTarget.set(car.x*.35,1.8,car.z-7);camera.lookAt(cameraTarget);
}
function resize(){const w=mount.clientWidth,h=mount.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(mount);resize();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.035);simulate(dt);followCamera(dt);renderer.render(scene,camera);
});
</script>
</body>
</html>
